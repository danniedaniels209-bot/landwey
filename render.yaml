services:
  - type: web
    name: landwey
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — client-side routing (if added later) still resolves to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hero video / community photos are content-hashed by Vite where possible,
      # but these live in /public and are served verbatim — cache them long-lived.
      - path: /video/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
